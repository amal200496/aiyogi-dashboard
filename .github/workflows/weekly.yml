name: Publish dashboard

on:
  schedule:
    # Friday 18:30 UTC = Saturday 12:00 am IST
    - cron: "30 18 * * 5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp weekly refresh time
        if: github.event_name == 'schedule'
        run: |
          echo "window.LAST_UPDATED = \"$(date -u +%Y-%m-%d)T18:30:00Z\";" > updated.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
