<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>AIYogi Campaign Dashboard</title>
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }

  :root {
    --bg: oklch(0.985 0.002 270);
    --surface: oklch(1 0 0);
    --ink: oklch(0.2 0.01 270);
    --muted: oklch(0.47 0.012 270);
    --line: oklch(0.92 0.004 270);
    --accent: oklch(0.5 0.1 80);
    --accent-fill: oklch(0.8 0.13 85);
    --ok: oklch(0.48 0.11 150);
    --watch: oklch(0.5 0.12 75);
    --risk: oklch(0.5 0.17 27);
    --r: 10px;
    --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.16 0.006 270); --surface: oklch(0.2 0.007 270); --ink: oklch(0.95 0.004 270);
    --muted: oklch(0.72 0.01 270); --line: oklch(0.28 0.008 270); --accent: oklch(0.82 0.11 85);
    --ok: oklch(0.78 0.13 150); --watch: oklch(0.82 0.11 85); --risk: oklch(0.74 0.15 27);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.16 0.006 270); --surface: oklch(0.2 0.007 270); --ink: oklch(0.95 0.004 270);
      --muted: oklch(0.72 0.01 270); --line: oklch(0.28 0.008 270); --accent: oklch(0.82 0.11 85);
      --ok: oklch(0.78 0.13 150); --watch: oklch(0.82 0.11 85); --risk: oklch(0.74 0.15 27);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line); transition: text-decoration-color 150ms ease; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0; }
  .wordmark { font-weight: 600; letter-spacing: -0.01em; }
  .bar .tools { display: flex; gap: 8px; align-items: center; }
  .theme, select.week {
    font: inherit; font-size: 0.875rem; color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px; transition: color 150ms ease, border-color 150ms ease;
  }
  select.week { padding: 4px 8px; max-width: 46vw; }
  select.week option { color: #111; background: #fff; }
  .theme:hover, select.week:hover { color: var(--ink); border-color: var(--muted); }

  .meta { margin: 32px 0 0; color: var(--muted); font-size: 0.875rem; }
  h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.025em; font-weight: 600; margin: 10px 0 14px; text-wrap: balance; }
  .lede { margin: 0; font-size: 1.125rem; line-height: 1.55; max-width: 56ch; text-wrap: pretty; }

  .badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 0.875rem; font-weight: 500; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.ontrack { color: var(--ok); } .badge.watch { color: var(--watch); } .badge.atrisk { color: var(--risk); }
  .badge span { color: var(--ink); }
  .badge-why { margin-top: 8px; color: var(--muted); font-size: 0.875rem; max-width: 60ch; }

  .progress { margin-top: 28px; }
  .weeks { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; }
  .weeks i { height: 6px; border-radius: 3px; background: var(--line); }
  .weeks i.done { background: var(--ink); }
  .weeks i.now { background: var(--accent-fill); }
  .weeks-label { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 0.875rem; }

  section { margin-top: 44px; }
  h2 { font-size: 1.125rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.875rem; margin: 0 0 16px; max-width: 60ch; }

  .ask { border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; background: var(--surface); }
  .ask.high { border-color: var(--accent); }
  .ask + .ask { margin-top: 10px; }
  .ask h3 { margin: 0 0 6px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
  .ask p { color: var(--muted); max-width: 58ch; }
  .ask .unblocks { margin-top: 10px; color: var(--ink); font-size: 0.875rem; }
  .ask .unblocks b { font-weight: 600; }
  .nothing { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

  .group { margin: 28px 0 8px; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
  .group:first-child { margin-top: 0; }
  ul.list { margin: 0; padding: 0; list-style: none; }
  .row { display: flex; justify-content: space-between; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:first-child { padding-top: 0; }
  .row .k { min-width: 0; }
  .row .n { display: block; color: var(--muted); font-size: 0.875rem; }
  .row .v { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row .w { color: var(--muted); font-size: 0.875rem; text-align: right; }

  /* North Star */
  .north { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 20px; display: grid; gap: 14px; }
  .north .label { color: var(--muted); font-size: 0.875rem; }
  .big { font-size: 2.5rem; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .big.empty { font-size: 1.25rem; color: var(--muted); letter-spacing: -0.01em; font-weight: 500; }
  .delta { font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .src { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  svg.trend { width: 100%; height: 64px; display: block; }

  /* Funnel */
  .funnel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .stage { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 12px 16px; }
  .stage + .stage { border-top: 1px solid var(--line); }
  .stage .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .stage .v.empty { color: var(--muted); font-weight: 400; font-size: 0.875rem; }
  .stage .src { grid-column: 1 / -1; }

  /* Channels */
  .channels { display: grid; gap: 12px; }
  .chan { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; }
  .chan h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .chan .status { color: var(--muted); font-size: 0.875rem; margin-top: 2px; }
  .metric { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
  .metric .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .metric .v.empty { color: var(--muted); font-weight: 400; font-size: 0.875rem; }
  .metric .unit { color: var(--muted); font-weight: 400; font-size: 0.8125rem; }
  .metric .src, .metric .n { grid-column: 1 / -1; }
  .metric .n { color: var(--muted); font-size: 0.875rem; }

  /* Shipped vs plan */
  .tag { display: inline-block; min-width: 76px; font-size: 0.8125rem; font-weight: 500; }
  .tag.done { color: var(--ok); } .tag.waiting { color: var(--watch); } .tag.moved { color: var(--muted); } .tag.dropped { color: var(--risk); }
  .ship { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ship:first-child { padding-top: 0; }
  .ship .why { display: block; color: var(--muted); font-size: 0.875rem; }
  .counts { color: var(--muted); font-size: 0.875rem; margin-bottom: 14px; }

  .day { display: grid; grid-template-columns: 76px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .day:first-child { padding-top: 0; }
  .day b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .day li:nth-child(2) { color: var(--muted); }

  .decision { padding: 12px 0; }
  .decision + .decision { border-top: 1px solid var(--line); }
  .decision h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chips span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.875rem; }

  .state { font-size: 0.8125rem; font-weight: 500; white-space: nowrap; }
  .state.ok { color: var(--ok); } .state.wait { color: var(--watch); } .state.manual { color: var(--muted); }

  .folds { display: grid; gap: 8px; }
  details { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; width: 7px; height: 7px; flex: none; margin-right: 4px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); transition: transform 150ms ease; }
  details[open] > summary::after { transform: rotate(225deg) translateY(-2px); }
  summary .hint { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 0.875rem; }
  .fold-body { padding: 4px 16px 18px; }
  .fold-body > * + * { margin-top: 14px; }
  .fold-body > .group { margin-top: 26px; margin-bottom: 0; }
  .fold-body > .group + * { margin-top: 10px; }
  .bullets { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
  .url { font-family: var(--mono); font-size: 0.8125rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); overflow-wrap: anywhere; }
  .url .val { color: var(--accent); font-weight: 600; }

  .archive-note { margin-top: 24px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 0.875rem; }
  footer { margin-top: 72px; color: var(--muted); font-size: 0.875rem; display: grid; gap: 4px; }

  @media (min-width: 640px) { .channels { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) {
    h1 { font-size: 1.75rem; }
    .lede { font-size: 1.0625rem; }
    .day { grid-template-columns: 64px 1fr; gap: 12px; }
    .ship { grid-template-columns: 1fr; gap: 2px; }
    .row { gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    :root { --bg: #fff; --surface: #fff; --ink: #111; --muted: #444; --line: #ccc; --accent: #7a5c00; }
    .theme, select.week { display: none; }
    section { margin-top: 28px; break-inside: avoid-page; }
    .ask, .chan, .decision, .stage, .north { break-inside: avoid; }
    details > .fold-body { display: block; }
    summary::after { display: none; }
    .wrap { max-width: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="wordmark">AIYogi</span>
    <div class="tools">
      <select class="week" id="week" aria-label="Choose a report week"></select>
      <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Dark</button>
    </div>
  </div>
  <noscript><p>This dashboard needs JavaScript to display.</p></noscript>
  <main id="app"></main>
  <footer id="footer"></footer>
</div>

<script>
  // Load data fresh every minute so a new weekly deploy is never mixed with stale cached data.
  (function () {
    var v = Math.floor(Date.now() / 60000);
    document.write('<script src="data.js?v=' + v + '"><\/script><script src="updated.js?v=' + v + '"><\/script>');
  })();
</script>
<script>
(function () {
  var R = window.REPORT, TZ = "America/New_York", SVGNS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function s(tag, attrs) { var e = document.createElementNS(SVGNS, tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
  function fmt(d, o) { return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: TZ }, o)).format(d); }
  function stamp(d) {
    return fmt(d, { weekday: "short", day: "numeric", month: "short" }) + ", " + fmt(d, { hour: "numeric", minute: "2-digit" }) + " " + fmt(d, { timeZoneName: "short" }).split(" ").pop();
  }
  function day(iso) { return fmt(new Date(iso + "T12:00:00Z"), { day: "numeric", month: "short" }); }
  function nextRefresh(now) {
    var c = R.schedule.cronUtc, d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), c.hour, c.minute));
    while (d.getUTCDay() !== c.weekday || d <= now) d = new Date(d.getTime() + 86400000);
    return d;
  }
  function bullets(items) { var u = h("ul", { class: "bullets" }); items.forEach(function (t) { u.appendChild(h("li", { text: t })); }); return u; }
  function fold(title, hint, body) {
    return h("details", null, [h("summary", null, [h("span", { text: title }), hint ? h("span", { class: "hint", text: hint }) : null]), h("div", { class: "fold-body" }, body)]);
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function srcLine(m) {
    if (m.value === null || m.value === undefined) return null;
    var bits = [];
    if (m.source) bits.push("Source: " + m.source);
    if (m.asOf) bits.push("as of " + day(m.asOf));
    return bits.length ? h("span", { class: "src", text: bits.join(", ") }) : null;
  }
  function deltaEl(m) {
    if (!isNum(m.value) || !isNum(m.prev)) return null;
    var d = m.value - m.prev;
    return h("span", { class: "delta", text: (d > 0 ? "+" : d < 0 ? "-" : "") + Math.abs(d) + " vs last week" });
  }
  function valueEl(m, cls) {
    if (m.value === null || m.value === undefined) return h("span", { class: cls + " empty", text: "Not measured yet" });
    return h("span", { class: cls }, [String(m.value), m.unit ? h("span", { class: "unit", text: " " + m.unit }) : null]);
  }
  function warn(m, where) {
    if (m.value !== null && m.value !== undefined && (!m.source || !m.asOf)) console.warn("Metric without source or date:", where, m.label);
  }

  /* Trend of the North Star across all weeks, oldest to newest. Needs two points. */
  function trend() {
    var pts = R.weeks.slice().reverse().filter(function (w) { return w.northStar && isNum(w.northStar.value); }).map(function (w) { return w.northStar.value; });
    if (pts.length < 2) return null;
    var W = 300, H = 64, pad = 6, max = Math.max.apply(null, pts), min = Math.min.apply(null, pts), span = max - min || 1;
    var svg = s("svg", { class: "trend", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Verified emails per week, from " + pts[0] + " to " + pts[pts.length - 1] });
    var path = pts.map(function (v, i) { return (i ? "L" : "M") + (pad + i * (W - 2 * pad) / (pts.length - 1)).toFixed(1) + " " + (H - pad - (v - min) / span * (H - 2 * pad)).toFixed(1); }).join(" ");
    svg.appendChild(s("path", { d: path, fill: "none", stroke: "var(--accent)", "stroke-width": "2", "stroke-linejoin": "round", "stroke-linecap": "round" }));
    return svg;
  }

  var weeks = R.weeks, byId = {}; weeks.forEach(function (w) { byId[w.id] = w; });
  var sel = $("week"), app = $("app");
  weeks.forEach(function (w, i) { sel.appendChild(h("option", { value: w.id, text: w.title + (i === 0 ? " (latest)" : "") })); });

  var now = new Date(), updated = new Date(window.LAST_UPDATED);

  function render(w) {
    app.textContent = "";
    var latest = w === weeks[0];
    var high = (w.actions || []).filter(function (a) { return a.priority === "high"; }), rest = (w.actions || []).filter(function (a) { return a.priority !== "high"; });
    var headline = "Week " + w.number + " of " + R.campaign.totalWeeks + ". " +
      (!(w.actions || []).length ? "Nothing needed from you."
        : high.length ? (["", "One thing", "Two things", "Three things"][high.length] || high.length + " things") + " we need from you" + (rest.length ? ", plus " + rest.length + " smaller." : ".")
        : rest.length + " small " + (rest.length === 1 ? "thing" : "things") + " we need from you.");

    if (!latest) app.appendChild(h("p", { class: "archive-note", text: "You are viewing an earlier report. Numbers are as they were then." }));
    app.appendChild(h("p", { class: "meta", text: "Hi " + R.owner + ". " + w.covers + ". Last updated " + stamp(updated) + " (Florida time)." + (latest ? " The next update is " + stamp(nextRefresh(now)) + "." : "") }));
    app.appendChild(h("h1", { text: headline }));
    app.appendChild(h("p", { class: "lede", text: w.summary }));
    if (w.status) {
      app.appendChild(h("div", { class: "badge " + w.status.level }, [h("i"), h("span", { text: w.status.label })]));
      app.appendChild(h("p", { class: "badge-why", text: w.status.text }));
    }
    var bar = h("div", { class: "weeks", role: "img", "aria-label": "Campaign progress, week " + w.number + " of " + R.campaign.totalWeeks });
    for (var i = 1; i <= R.campaign.totalWeeks; i++) bar.appendChild(h("i", { class: i < w.number ? "done" : i === w.number ? "now" : "" }));
    app.appendChild(h("div", { class: "progress" }, [bar, h("div", { class: "weeks-label" }, [h("span", { text: "Week " + w.number + " of " + R.campaign.totalWeeks }), h("span", { text: "1 Oct to 31 Jan" })])]));

    function section(title, sub) { var e = h("section", null, [h("h2", { text: title }), sub ? h("p", { class: "sub", text: sub }) : null]); app.appendChild(e); return e; }

    /* Needs you */
    var s1 = section("What we need from you", (w.actions || []).length ? "What each one unblocks is listed with it." : null);
    if (!(w.actions || []).length) s1.appendChild(h("div", { class: "nothing", text: "Nothing needed from you this week." }));
    function askCard(a) {
      return h("div", { class: "ask " + a.priority }, [
        h("h3", { text: a.title }), h("p", { text: a.detail }),
        a.unblocks ? h("p", { class: "unblocks" }, [h("b", { text: "Unblocks: " }), a.unblocks]) : null
      ]);
    }
    (high.length ? high : rest).forEach(function (a) { s1.appendChild(askCard(a)); });
    if (high.length && rest.length) s1.appendChild(h("div", { class: "folds", style: "margin-top:10px" }, [fold(rest.length + " smaller " + (rest.length === 1 ? "thing" : "things"), "When you have a moment", rest.map(askCard))]));

    /* North Star */
    if (w.northStar) {
      var n = w.northStar; warn(n, "northStar");
      var s2 = section("Our main number", "The one number the whole campaign is aiming at.");
      var t = isNum(n.value) ? trend() : null;
      s2.appendChild(h("div", { class: "north" }, [
        h("span", { class: "label", text: n.label }),
        isNum(n.value) ? h("span", { class: "big", text: String(n.value) }) : h("span", { class: "big empty", text: "Not measured yet" }),
        deltaEl(n), t, srcLine(n), n.note ? h("p", { class: "small muted", text: n.note }) : null
      ]));
    }

    /* Funnel */
    if (w.funnel) {
      var s3 = section("From visit to supporter", w.funnel.note);
      var f = h("div", { class: "funnel" });
      w.funnel.stages.forEach(function (st) {
        warn(st, "funnel");
        f.appendChild(h("div", { class: "stage" }, [h("span", { text: st.label }), valueEl(st, "v"), isNum(st.value) ? deltaEl(st) : null, srcLine(st), isNum(st.value) && st.note ? h("span", { class: "src", text: st.note }) : null]));
      });
      s3.appendChild(f);
    }

    /* Channels */
    if (w.channels) {
      var s4 = section("Channel by channel", "Each figure shows where it came from and when.");
      var grid = h("div", { class: "channels" });
      w.channels.forEach(function (c) {
        var card = h("div", { class: "chan" }, [h("h3", { text: c.name }), h("p", { class: "status", text: c.status })]);
        (c.metrics || []).forEach(function (m) {
          warn(m, c.name);
          card.appendChild(h("div", { class: "metric" }, [h("span", { text: m.label }), valueEl(m, "v"), deltaEl(m), srcLine(m), m.note ? h("span", { class: "n", text: m.note }) : null]));
        });
        grid.appendChild(card);
      });
      s4.appendChild(grid);
    }

    /* Shipped vs plan */
    if (w.shipped) {
      var counts = { done: 0, waiting: 0, moved: 0, dropped: 0 };
      w.shipped.forEach(function (x) { counts[x.state]++; });
      var s5 = section("Shipped against plan");
      s5.appendChild(h("p", { class: "counts", text: counts.done + " done, " + counts.waiting + " waiting on something, " + counts.moved + " moved" + (counts.dropped ? ", " + counts.dropped + " dropped" : "") }));
      var names = { done: "Done", waiting: "Waiting", moved: "Moved", dropped: "Dropped" };
      function shipRows(states) {
        var list = h("div");
        states.forEach(function (st) {
          w.shipped.filter(function (x) { return x.state === st; }).forEach(function (x) {
            list.appendChild(h("div", { class: "ship" }, [h("span", { class: "tag " + st, text: names[st] }), h("span", null, [x.text, x.reason ? h("span", { class: "why", text: x.reason }) : null])]));
          });
        });
        return list;
      }
      if (counts.waiting + counts.moved + counts.dropped) s5.appendChild(shipRows(["waiting", "moved", "dropped"]));
      if (counts.done) s5.appendChild(h("div", { class: "folds", style: "margin-top:12px" }, [fold("Done this period", counts.done + " items", [shipRows(["done"])])]));
    }

    /* Next week */
    if (w.next) {
      var s6 = section(w.next.label);
      var d6 = h("div");
      w.next.days.forEach(function (d) { d6.appendChild(h("div", { class: "day" }, [h("b", { text: d.day }), h("ul", null, d.items.map(function (x) { return h("li", { text: x }); }))])); });
      s6.appendChild(d6);
      if (w.next.dependsOn) s6.appendChild(h("p", { class: "muted small", text: w.next.dependsOn, style: "margin-top:16px" }));
    }

    /* Learnings */
    if (w.learnings) { var s7 = section("What we learned"); s7.appendChild(bullets(w.learnings)); }

    /* Decisions */
    if (w.decisions && w.decisions.length) {
      var s8 = section("Decisions for you", "Pick whichever suits you, or tell us something different. We change nothing until you say.");
      s8.appendChild(h("div", { class: "folds" }, [fold(w.decisions.length + " open " + (w.decisions.length === 1 ? "question" : "questions"), "Take your time", w.decisions.map(function (d) {
        return h("div", { class: "decision" }, [h("h3", { text: d.question }), h("p", { class: "muted small", text: d.context }), h("div", { class: "chips" }, d.options.map(function (o) { return h("span", { text: o }); }))]);
      }))]));
    }

    /* Connections and tracking health */
    if (w.connections) {
      var s9 = section("What's connected", "Whether each tool is working, waiting or handled by hand.");
      var labels = { ok: "Working", wait: "Waiting", manual: "By hand" }, body9 = [];
      w.connections.forEach(function (g) {
        body9.push(h("div", { class: "group", text: g.group }));
        var d = h("div");
        g.items.forEach(function (o) { d.appendChild(h("div", { class: "row" }, [h("span", { class: "k" }, [o.item, o.note ? h("span", { class: "n", text: o.note }) : null]), h("span", { class: "state " + g.state, text: labels[g.state] })])); });
        body9.push(d);
      });
      var tally = w.connections.map(function (g) { return g.items.length + " " + labels[g.state].toLowerCase(); }).join(", ");
      s9.appendChild(h("div", { class: "folds" }, [fold("Tools and tracking", tally, body9)]));
    }

    /* Done so far */
    if (w.achieved) {
      var s10 = section("What we've done"), shown = w.achieved.slice(0, 4), more = w.achieved.slice(4);
      function items(a) { var u = h("ul", { class: "list" }); a.forEach(function (x) { u.appendChild(h("li", { class: "row" }, [h("span", { class: "k", text: x.text }), h("span", { class: "w", text: x.when })])); }); return u; }
      s10.appendChild(items(shown));
      if (more.length) s10.appendChild(h("div", { class: "folds", style: "margin-top:12px" }, [fold("Earlier", more.length + " more", [items(more)])]));
    }

    /* Detail folds (shared) */
    if (latest) {
      var s11 = section("The detail, if you want it"), folds = h("div", { class: "folds" }); s11.appendChild(folds);
      var E = w.expect;
      if (E) folds.appendChild(fold("What to expect", null, [h("div", { class: "group", text: "You'll see" }), bullets(E.see), h("div", { class: "group", text: "Not yet" }), bullets(E.notYet), h("div", { class: "group", text: "How we work" }), bullets(E.how)]));

      var P = R.posts;
      folds.appendChild(fold("What we're posting", "X and LinkedIn", [h("p", { class: "muted small", text: P.note }), h("div", { class: "group", text: "Themes so far" }), bullets(P.themes), h("p", { class: "muted small", text: P.next })]));

      var T = R.tracking, u = T.example.split("?"), q = u[1].split("&"), url = h("div", { class: "url" }, [u[0] + "?"]);
      q.forEach(function (kv, idx) { var p = kv.split("="); url.appendChild(document.createTextNode(p[0] + "=")); url.appendChild(h("span", { class: "val", text: p[1] })); if (idx < q.length - 1) url.appendChild(document.createTextNode("&")); });
      folds.appendChild(fold("How we'll know who clicked", null, [
        h("p", { text: T.intro }), url,
        h("div", null, T.parts.map(function (p) { return h("div", { class: "row" }, [h("span", { class: "k", style: "font-family:var(--mono);font-size:0.8125rem", text: p.tag }), h("span", { class: "w", style: "max-width:60%", text: p.means })]); })),
        h("p", { class: "muted small", text: T.status }), h("p", { class: "muted small", text: T.meanwhile })
      ]));

      folds.appendChild(fold("How we'll handle Reddit", null, [h("p", { class: "muted small", text: R.reddit.status }), bullets(R.reddit.principles), h("p", { class: "small", text: "Where we'll start: " + R.reddit.communities.join(", ") }), h("p", { class: "muted small", text: "How we'll measure it: " + R.reddit.measure })]));

      var ol = h("ol", { class: "bullets" }); R.youtube.plan.forEach(function (x) { ol.appendChild(h("li", { text: x })); });
      folds.appendChild(fold("YouTube and thumbnails", R.youtube.status, [ol]));

      var A = R.agreement, al = h("div");
      A.allocation.forEach(function (a) { al.appendChild(h("div", { class: "row" }, [h("span", { class: "k", text: a[0] }), h("span", { class: "v", text: a[1] })])); });
      folds.appendChild(fold("How we work together", A.hours, [h("p", { class: "muted small", text: A.note }), al, h("div", { class: "group", text: "Not included" }), bullets(A.out), h("p", { class: "muted small", text: A.change })]));
    }
  }

  var footer = $("footer");
  footer.appendChild(h("span", null, ["Questions? ", h("a", { href: "mailto:" + R.contact, text: R.contact })]));
  footer.appendChild(h("span", { text: R.schedule.note }));
  footer.appendChild(h("span", { text: "Working agreement: " + R.agreement.hours.toLowerCase() + "." }));

  function show(id) { var w = byId[id] || weeks[0]; sel.value = w.id; render(w); }
  var start = (location.hash || "").replace("#", "");
  show(start);
  sel.addEventListener("change", function () { try { history.replaceState(null, "", sel.value === weeks[0].id ? location.pathname : "#" + sel.value); } catch (e) {} show(sel.value); window.scrollTo(0, 0); });
  if (weeks.length < 2) sel.style.display = "none";

  /* Theme */
  var root = document.documentElement, btn = $("theme");
  function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function label() { btn.textContent = isDark() ? "Light" : "Dark"; }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  label();
  btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
