<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>AIYogi Campaign Dashboard</title>
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }

  :root {
    /* One neutral, one accent. Radius is 10px everywhere. */
    --bg: oklch(0.985 0.002 270);
    --surface: oklch(1 0 0);
    --ink: oklch(0.2 0.01 270);
    --muted: oklch(0.47 0.012 270);
    --line: oklch(0.92 0.004 270);
    --accent: oklch(0.5 0.1 80);
    --accent-fill: oklch(0.8 0.13 85);
    --r: 10px;
    --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.16 0.006 270);
    --surface: oklch(0.2 0.007 270);
    --ink: oklch(0.95 0.004 270);
    --muted: oklch(0.72 0.01 270);
    --line: oklch(0.28 0.008 270);
    --accent: oklch(0.82 0.11 85);
    --accent-fill: oklch(0.8 0.13 85);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.16 0.006 270);
      --surface: oklch(0.2 0.007 270);
      --ink: oklch(0.95 0.004 270);
      --muted: oklch(0.72 0.01 270);
      --line: oklch(0.28 0.008 270);
      --accent: oklch(0.82 0.11 85);
      --accent-fill: oklch(0.8 0.13 85);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 1rem/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line); transition: text-decoration-color 150ms ease; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px 96px; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .wordmark { font-weight: 600; letter-spacing: -0.01em; }
  .theme {
    font: inherit; font-size: 0.875rem; color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px;
    transition: color 150ms ease, border-color 150ms ease;
  }
  .theme:hover { color: var(--ink); border-color: var(--muted); }

  .meta { margin: 40px 0 0; color: var(--muted); font-size: 0.875rem; }
  h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.025em; font-weight: 600; margin: 10px 0 16px; text-wrap: balance; }
  .lede { margin: 0; font-size: 1.125rem; line-height: 1.55; max-width: 56ch; text-wrap: pretty; }
  .weeks { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; margin-top: 32px; }
  .weeks i { height: 6px; border-radius: 3px; background: var(--line); }
  .weeks i.done { background: var(--ink); }
  .weeks i.now { background: var(--accent-fill); }
  .weeks-label { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 0.875rem; }

  section { margin-top: 56px; }
  h2 { font-size: 1.125rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; margin: 0 0 16px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }

  .ask { border: 1px solid var(--accent); border-radius: var(--r); padding: 20px; background: var(--surface); }
  .ask h3 { margin: 0 0 6px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
  .ask p { color: var(--muted); max-width: 56ch; }

  dl, ul.list, ol.list { margin: 0; padding: 0; list-style: none; }
  .row { display: flex; justify-content: space-between; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:first-child { padding-top: 0; }
  .row .k { min-width: 0; }
  .row .n { display: block; color: var(--muted); font-size: 0.875rem; }
  .row .v { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .w { color: var(--muted); font-size: 0.875rem; white-space: nowrap; text-align: right; }

  .day { display: grid; grid-template-columns: 72px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .day:first-child { padding-top: 0; }
  .day b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .day li:nth-child(2) { color: var(--muted); }

  .group { margin: 28px 0 8px; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
  .group:first-of-type { margin-top: 0; }

  /* Folded details */
  .folds { display: grid; gap: 8px; }
  details { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  summary {
    list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-weight: 500;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: ""; width: 7px; height: 7px; flex: none; margin-right: 4px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px);
    transition: transform 150ms ease;
  }
  details[open] > summary::after { transform: rotate(225deg) translateY(-2px); }
  summary .hint { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 0.875rem; }
  .fold-body { padding: 4px 16px 18px; }
  .fold-body > * + * { margin-top: 14px; }
  .fold-body > .group { margin-top: 26px; margin-bottom: 0; }
  .fold-body > .group + * { margin-top: 10px; }
  .bullets { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
  .url { font-family: var(--mono); font-size: 0.8125rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); overflow-wrap: anywhere; }
  .url .val { color: var(--accent); font-weight: 600; }
  .post { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .post:first-of-type { padding-top: 0; }
  .post .d { color: var(--muted); font-size: 0.875rem; padding-top: 1px; }
  .post .c { display: block; color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; margin-top: 2px; }

  footer { margin-top: 72px; color: var(--muted); font-size: 0.875rem; display: grid; gap: 4px; }

  @media (max-width: 480px) {
    h1 { font-size: 1.75rem; }
    .lede { font-size: 1.0625rem; }
    .day { grid-template-columns: 60px 1fr; gap: 12px; }
    .row { gap: 16px; }
    .row .v { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { .theme { display: none; } details { break-inside: avoid; } details > .fold-body { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="wordmark">AIYogi</span>
    <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Dark</button>
  </div>
  <noscript><p>This dashboard needs JavaScript to display.</p></noscript>
  <main id="app"></main>
  <footer id="footer"></footer>
</div>

<script>
  // Load data fresh every minute so a new weekly deploy is never mixed with stale cached data.
  (function () {
    var v = Math.floor(Date.now() / 60000);
    document.write('<script src="data.js?v=' + v + '"><\/script><script src="updated.js?v=' + v + '"><\/script>');
  })();
</script>
<script>
(function () {
  var R = window.REPORT, TZ = "America/New_York";
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function fmt(d, o) { return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: TZ }, o)).format(d); }
  function stamp(d) {
    return fmt(d, { weekday: "short", day: "numeric", month: "short" }) + ", " + fmt(d, { hour: "numeric", minute: "2-digit" }) + " " + fmt(d, { timeZoneName: "short" }).split(" ").pop();
  }
  function nextRefresh(now) {
    var s = R.schedule.cronUtc, d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), s.hour, s.minute));
    while (d.getUTCDay() !== s.weekday || d <= now) d = new Date(d.getTime() + 86400000);
    return d;
  }
  function list(items, cls) { var u = h("ul", { class: cls || "list" }); items.forEach(function (t) { u.appendChild(h("li", { class: "row" }, [h("span", { class: "k", text: t })])); }); return u; }
  function bullets(items) { var u = h("ul", { class: "bullets" }); items.forEach(function (t) { u.appendChild(h("li", { text: t })); }); return u; }
  function fold(title, hint, body, open) {
    var d = h("details", open ? { open: "" } : null, [h("summary", null, [h("span", { text: title }), hint ? h("span", { class: "hint", text: hint }) : null]), h("div", { class: "fold-body" }, body)]);
    return d;
  }

  var now = new Date(), updated = new Date(window.LAST_UPDATED);
  var start = new Date(R.campaign.start + "T00:00:00Z");
  var weekNo = Math.min(R.campaign.totalWeeks, Math.max(1, Math.floor((now - start) / 604800000) + 1));
  var asks = R.actions.length;
  var app = $("app");

  /* Header */
  app.appendChild(h("p", { class: "meta", text: "Hi " + R.owner + ". Last updated " + stamp(updated) + " (Florida time). The next update is " + stamp(nextRefresh(now)) + "." }));
  app.appendChild(h("h1", { text: "Week " + weekNo + " of " + R.campaign.totalWeeks + (asks === 0 ? ". Nothing needed from you." : asks === 1 ? ". One thing we need from you." : ". " + asks + " things we need from you.") }));
  app.appendChild(h("p", { class: "lede", text: R.summary }));
  var weeks = h("div", { class: "weeks", role: "img", "aria-label": "Campaign progress, week " + weekNo + " of " + R.campaign.totalWeeks });
  for (var i = 1; i <= R.campaign.totalWeeks; i++) weeks.appendChild(h("i", { class: i < weekNo ? "done" : i === weekNo ? "now" : "" }));
  app.appendChild(weeks);
  app.appendChild(h("div", { class: "weeks-label" }, [h("span", { text: R.reportWeekLabel }), h("span", { text: "1 Oct to 31 Jan" })]));

  function section(title) { var s = h("section", null, [h("h2", { text: title })]); app.appendChild(s); return s; }

  /* Needs you */
  if (asks) {
    var s1 = section("What we need from you");
    R.actions.forEach(function (a) { s1.appendChild(h("div", { class: "ask" }, [h("h3", { text: a.title }), h("p", { text: a.detail })])); });
  }

  /* Numbers */
  var s2 = section("Where things stand");
  var d2 = h("div"); R.metrics.forEach(function (m) { d2.appendChild(h("div", { class: "row" }, [h("span", { class: "k" }, [m.label, h("span", { class: "n", text: m.note })]), h("span", { class: "v", text: m.value })])); });
  s2.appendChild(d2);

  /* Next week */
  var s3 = section(R.weekPlan.label);
  var d3 = h("div"); R.weekPlan.days.forEach(function (d) { d3.appendChild(h("div", { class: "day" }, [h("b", { text: d.day }), h("ul", null, d.items.map(function (t) { return h("li", { text: t }); }))])); });
  s3.appendChild(d3);
  s3.appendChild(h("p", { class: "muted small", text: R.weekPlan.dependsOn, style: "margin-top:16px" }));

  /* Okara connections */
  var s4 = section("What's connected to Okara");
  R.connections.forEach(function (g) {
    s4.appendChild(h("div", { class: "group", text: g.group }));
    var d = h("div"); g.items.forEach(function (o) {
      d.appendChild(h("div", { class: "row" }, [h("span", { class: "k" }, [o.item, o.note ? h("span", { class: "n", text: o.note }) : null]), o.when ? h("span", { class: "w", text: o.when }) : null]));
    });
    s4.appendChild(d);
  });

  /* Done so far */
  var s5 = section("What we've done");
  var rev = R.achieved.slice().reverse(), shown = rev.slice(0, 4), rest = rev.slice(4);
  s5.appendChild(list(shown.map(function (a) { return a.text; })));
  if (rest.length) s5.appendChild(h("div", { class: "folds", style: "margin-top:12px" }, [fold("Earlier", rest.length + " more", [list(rest.map(function (a) { return a.text; }))])]));

  /* Folded detail */
  var s6 = section("The detail, if you want it");
  var folds = h("div", { class: "folds" }); s6.appendChild(folds);

  var E = R.expect;
  folds.appendChild(fold("What to expect this week", null, [
    h("div", { class: "group", text: "You'll see" }), bullets(E.see),
    h("div", { class: "group", text: "Not yet" }), bullets(E.notYet),
    h("div", { class: "group", text: "How we work" }), bullets(E.how)
  ]));

  var xBody = [h("p", { class: "muted small", text: R.posts.note })];
  [["X", R.posts.x, 280], ["LinkedIn", R.posts.linkedin, 0]].forEach(function (p) {
    xBody.push(h("div", { class: "group", text: p[0] + ", " + p[1].length + " posts" }));
    var wrap = h("div");
    p[1].forEach(function (t) {
      var i = t.indexOf(":"), day = t.slice(0, i), body = t.slice(i + 1).trim();
      wrap.appendChild(h("div", { class: "post" }, [h("span", { class: "d", text: day }), h("div", null, [h("span", { text: body }), p[2] ? h("span", { class: "c", text: body.length + " of " + p[2] + " characters" }) : null])]));
    });
    xBody.push(wrap);
  });
  folds.appendChild(fold("This week's posts", "7 on X, 3 on LinkedIn", xBody));

  var T = R.tracking, u = T.example.split("?"), q = u[1].split("&"), url = h("div", { class: "url" }, [u[0] + "?"]);
  q.forEach(function (kv, idx) { var p = kv.split("="); url.appendChild(document.createTextNode(p[0] + "=")); url.appendChild(h("span", { class: "val", text: p[1] })); if (idx < q.length - 1) url.appendChild(document.createTextNode("&")); });
  folds.appendChild(fold("How we'll know who clicked", null, [
    h("p", { text: T.intro }), url,
    h("div", null, T.parts.map(function (p) { return h("div", { class: "row" }, [h("span", { class: "k", style: "font-family:var(--mono);font-size:0.8125rem", text: p.tag }), h("span", { class: "w", style: "white-space:normal;max-width:60%", text: p.means })]); })),
    h("p", { class: "muted small", text: T.status }),
    h("p", { class: "muted small", text: T.meanwhile })
  ]));

  folds.appendChild(fold("How we'll handle Reddit", null, [
    h("p", { class: "muted small", text: R.reddit.status }), bullets(R.reddit.principles),
    h("p", { class: "small", text: "Where we'll start: " + R.reddit.communities.join(", ") }),
    h("p", { class: "muted small", text: "How we'll measure it: " + R.reddit.measure })
  ]));

  var ol = h("ol", { class: "bullets" }); R.youtube.plan.forEach(function (t) { ol.appendChild(h("li", { text: t })); });
  folds.appendChild(fold("YouTube and thumbnails", R.youtube.status, [ol]));

  var A = R.agreement, al = h("div");
  A.allocation.forEach(function (a) { al.appendChild(h("div", { class: "row" }, [h("span", { class: "k", text: a[0] }), h("span", { class: "v", text: a[1] })])); });
  folds.appendChild(fold("How we work together", A.hours, [
    h("p", { class: "muted small", text: A.note }), al,
    h("div", { class: "group", text: "Not included" }), bullets(A.out),
    h("p", { class: "muted small", text: A.change })
  ]));

  /* Footer */
  var a = h("a", { href: "mailto:" + R.contact, text: R.contact });
  $("footer").appendChild(h("span", null, ["Questions? ", a]));
  $("footer").appendChild(h("span", { text: R.schedule.note }));

  /* Theme */
  var root = document.documentElement, btn = $("theme");
  function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function label() { btn.textContent = isDark() ? "Light" : "Dark"; }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  label();
  btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
