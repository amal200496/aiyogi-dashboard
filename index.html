<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>AIYogi Campaign Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.004 275);
    --surface: oklch(1 0 0);
    --ink: oklch(0.2 0.03 275);
    --muted: oklch(0.46 0.02 275);
    --line: oklch(0.91 0.008 275);
    --line-strong: oklch(0.82 0.012 275);
    --gold: oklch(0.5 0.1 80);
    --gold-fill: oklch(0.78 0.13 85);
    --ok: oklch(0.48 0.12 155);
    --warn: oklch(0.5 0.12 70);
    --bad: oklch(0.5 0.17 27);
    --info: oklch(0.48 0.12 255);
    --tint: oklch(0.96 0.012 85);

    --z-sticky: 10;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.17 0.02 275);
    --surface: oklch(0.2 0.022 275);
    --ink: oklch(0.95 0.01 275);
    --muted: oklch(0.74 0.02 275);
    --line: oklch(0.28 0.02 275);
    --line-strong: oklch(0.38 0.025 275);
    --gold: oklch(0.82 0.12 85);
    --gold-fill: oklch(0.8 0.13 85);
    --ok: oklch(0.8 0.14 155);
    --warn: oklch(0.82 0.13 80);
    --bad: oklch(0.75 0.15 27);
    --info: oklch(0.78 0.11 255);
    --tint: oklch(0.23 0.025 85);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.17 0.02 275);
      --surface: oklch(0.2 0.022 275);
      --ink: oklch(0.95 0.01 275);
      --muted: oklch(0.74 0.02 275);
      --line: oklch(0.28 0.02 275);
      --line-strong: oklch(0.38 0.025 275);
      --gold: oklch(0.82 0.12 85);
      --gold-fill: oklch(0.8 0.13 85);
      --ok: oklch(0.8 0.14 155);
      --warn: oklch(0.82 0.13 80);
      --bad: oklch(0.75 0.15 27);
      --info: oklch(0.78 0.11 255);
      --tint: oklch(0.23 0.025 85);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 88px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 0.9375rem/1.55 var(--font);
    font-feature-settings: "cv11", "ss03";
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: text-decoration-color 150ms var(--ease); }
  a:hover { text-decoration-color: var(--gold); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 6px; z-index: 20; }
  .skip:focus { left: 8px; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 64px; max-width: 1060px; margin: 0 auto; padding: 0 24px; }
  .rail { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column; padding: 28px 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wordmark { font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .wordmark i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold-fill); display: inline-block; }
  .rail nav { margin-top: 28px; }
  .rail nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .rail nav a {
    display: block; padding: 6px 10px; margin-left: -10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 0.875rem;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .rail nav a:hover { color: var(--ink); background: var(--surface); }
  .rail nav a[aria-current="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
  .rail-foot { margin-top: auto; font-size: 0.8125rem; color: var(--muted); }
  .rail-foot a { color: var(--muted); }
  .theme {
    font: inherit; font-size: 0.8125rem; color: var(--muted); background: transparent;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer;
    transition: color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .theme:hover { color: var(--ink); border-color: var(--muted); }

  /* Header */
  main { padding-bottom: 96px; min-width: 0; }
  .top { padding: 44px 0 36px; }
  .context { color: var(--muted); font-size: 0.875rem; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .context b { color: var(--ink); font-weight: 500; }
  h1 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; margin: 14px 0 12px; text-wrap: balance; max-width: 24ch; }
  .lede { max-width: 62ch; color: var(--muted); margin: 0; font-size: 1.0625rem; line-height: 1.55; text-wrap: pretty; }
  .weeks { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; margin-top: 28px; }
  .weeks i { height: 6px; border-radius: 2px; background: var(--line); }
  .weeks i.done { background: var(--ink); }
  .weeks i.now { background: var(--gold-fill); }
  .weeks-label { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.8125rem; color: var(--muted); }

  /* Sections */
  section { padding: 36px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.01em; font-weight: 600; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: var(--muted); max-width: 62ch; }
  h3 { font-size: 0.9375rem; font-weight: 600; margin: 0; }

  /* Rows */
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rows > li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .need { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .need p { grid-column: 1 / -1; margin: 0; color: var(--muted); max-width: 66ch; }
  .level { font-size: 0.8125rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .level::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .level.high { color: var(--bad); } .level.medium { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-weight: 400; }
  table { border-top: 1px solid var(--line); }
  td.v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; padding-left: 16px; }
  td .n, .n { display: block; color: var(--muted); font-size: 0.8125rem; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 500; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.done { color: var(--ok); } .st.progress { color: var(--info); } .st.todo { color: var(--muted); } .st.blocked { color: var(--bad); }
  .st.todo::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

  .group { margin: 24px 0 8px; font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
  .group:first-of-type { margin-top: 0; }

  .agenda > li { display: grid; grid-template-columns: 64px 1fr; gap: 16px; }
  .agenda .d { font-weight: 600; font-variant-numeric: tabular-nums; }
  .agenda ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .callout { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--tint); font-size: 0.875rem; max-width: 66ch; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; }
  .post { display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
  .post .d { color: var(--muted); font-size: 0.8125rem; font-weight: 500; padding-top: 2px; }
  .post .t { text-wrap: pretty; }
  .post .c { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; margin-top: 2px; display: block; }

  .url { font-family: var(--mono); font-size: 0.8125rem; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); overflow-wrap: anywhere; margin: 0 0 16px; }
  .url .k { color: var(--muted); }
  .url .val { color: var(--gold); font-weight: 600; }
  .code { font-family: var(--mono); font-size: 0.8125rem; white-space: nowrap; padding-right: 20px; }
  .inline { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .inline li { font-family: var(--mono); font-size: 0.8125rem; padding: 2px 10px; border: 1px solid var(--line-strong); border-radius: 99px; color: var(--ink); }

  .bullets { margin: 0; padding-left: 18px; display: grid; gap: 8px; max-width: 66ch; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; max-width: 66ch; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
  .steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 0.75rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prose p { margin: 12px 0 0; max-width: 66ch; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 0; color: var(--muted); font-size: 0.8125rem; display: grid; gap: 4px; }

  /* Tablet and phone: rail becomes a sticky top bar */
  @media (max-width: 900px) {
    .shell { display: block; padding: 0 16px; }
    .rail {
      position: sticky; top: 0; z-index: var(--z-sticky); height: auto; padding: 12px 0 0;
      background: color-mix(in oklch, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); margin: 0 -16px; padding-inline: 16px;
    }
    .rail nav { margin: 10px -16px 0; overflow-x: auto; scrollbar-width: none; }
    .rail nav::-webkit-scrollbar { display: none; }
    .rail nav ul { display: flex; gap: 2px; padding: 0 16px 10px; }
    .rail nav a { margin: 0; white-space: nowrap; }
    .rail-foot { display: none; }
    .top { padding-top: 28px; }
    .cols { grid-template-columns: 1fr; gap: 32px; }
    html { scroll-padding-top: 112px; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    .lede { font-size: 1rem; }
    .agenda > li { grid-template-columns: 52px 1fr; gap: 12px; }
    .weeks { gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
  @media print {
    .rail, .theme, .skip { display: none; }
    .shell { display: block; }
    section { break-inside: avoid; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="wordmark"><i aria-hidden="true"></i>AIYogi</div>
      <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Dark</button>
    </div>
    <nav aria-label="Sections"><ul id="nav"></ul></nav>
    <div class="rail-foot" id="railfoot"></div>
  </aside>

  <main id="main">
    <noscript><p>This dashboard needs JavaScript to display.</p></noscript>
    <div id="app"></div>
    <footer id="footer"></footer>
  </main>
</div>

<script>
  // Load data fresh every minute so a new weekly deploy is never mixed with stale cached data.
  (function () {
    var v = Math.floor(Date.now() / 60000);
    document.write('<script src="data.js?v=' + v + '"><\/script><script src="updated.js?v=' + v + '"><\/script>');
  })();
</script>
<script>
(function () {
  var R = window.REPORT, TZ = "America/New_York";
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function fmt(d, o) { return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: TZ }, o)).format(d); }
  function stamp(d) {
    return fmt(d, { weekday: "short", day: "numeric", month: "short" }) + ", " + fmt(d, { hour: "numeric", minute: "2-digit" }) + " " + fmt(d, { timeZoneName: "short" }).split(" ").pop();
  }
  function nextRefresh(now) {
    var s = R.schedule.cronUtc, d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), s.hour, s.minute));
    while (d.getUTCDay() !== s.weekday || d <= now) d = new Date(d.getTime() + 86400000);
    return d;
  }

  var now = new Date(), updated = new Date(window.LAST_UPDATED);
  var start = new Date(R.campaign.start + "T00:00:00Z");
  var weekNo = Math.min(R.campaign.totalWeeks, Math.max(1, Math.floor((now - start) / 604800000) + 1));
  var urgent = R.actions.filter(function (a) { return a.priority === "high"; }).length;

  var sections = [];
  var app = $("app");
  function section(id, title, sub) {
    var s = h("section", { id: id, "aria-labelledby": id + "-h" }, [h("h2", { id: id + "-h", text: title })]);
    if (sub) s.appendChild(h("p", { class: "sub", text: sub }));
    app.appendChild(s); sections.push({ id: id, title: title }); return s;
  }

  /* Top */
  var top = h("div", { class: "top" }, [
    h("div", { class: "context" }, [
      h("span", null, ["Prepared for ", h("b", { text: R.owner })]),
      h("span", null, ["Updated ", h("b", { text: stamp(updated) })]),
      h("span", null, ["Next ", h("b", { text: stamp(nextRefresh(now)) })]),
      h("span", { text: "Florida time" })
    ]),
    h("h1", { text: "Week " + weekNo + " of " + R.campaign.totalWeeks + ": " + urgent + " items need your input" }),
    h("p", { class: "lede", text: R.summary })
  ]);
  var weeks = h("div", { class: "weeks", role: "img", "aria-label": "Campaign progress, week " + weekNo + " of " + R.campaign.totalWeeks });
  for (var i = 1; i <= R.campaign.totalWeeks; i++) weeks.appendChild(h("i", { class: i < weekNo ? "done" : i === weekNo ? "now" : "" }));
  top.appendChild(weeks);
  top.appendChild(h("div", { class: "weeks-label" }, [h("span", { text: R.reportWeekLabel.replace(/^.*covers /, "Report covers ") }), h("span", { text: "1 Oct to 31 Jan" })]));
  app.appendChild(top);

  /* Needed from you */
  var s1 = section("needed", "Needed from you", "These are holding work back. Most urgent first.");
  var l1 = h("ol", { class: "rows" });
  R.actions.forEach(function (a) {
    l1.appendChild(h("li", { class: "need" }, [
      h("h3", { text: a.title }),
      h("span", { class: "level " + a.priority, text: a.priority === "high" ? "Urgent" : "This month" }),
      h("p", { text: a.detail })
    ]));
  });
  s1.appendChild(l1);

  /* Numbers */
  var s2 = section("numbers", "Numbers so far", R.metricsNote);
  var t2 = h("table");
  R.metrics.forEach(function (m) {
    t2.appendChild(h("tr", null, [h("td", null, [m.label, h("span", { class: "n", text: m.note })]), h("td", { class: "v", text: m.value })]));
  });
  s2.appendChild(t2);

  /* Achieved */
  var s3 = section("achieved", "What we achieved", "Everything completed since kickoff.");
  var groups = {};
  R.achieved.forEach(function (a) { (groups[a.when] = groups[a.when] || []).push(a.text); });
  Object.keys(groups).forEach(function (g) {
    s3.appendChild(h("div", { class: "group", text: g }));
    var l = h("ul", { class: "rows" });
    groups[g].forEach(function (t) { l.appendChild(h("li", null, [t])); });
    s3.appendChild(l);
  });

  /* Next week */
  var s4 = section("plan", "Next week", R.weekPlan.label.replace(/^Next week · /, ""));
  var l4 = h("ul", { class: "rows agenda" });
  R.weekPlan.days.forEach(function (d) {
    l4.appendChild(h("li", null, [h("span", { class: "d", text: d.day }), h("ul", null, d.items.map(function (i) { return h("li", { text: i }); }))]));
  });
  s4.appendChild(l4);
  s4.appendChild(h("div", { class: "callout", text: R.weekPlan.dependsOn }));

  /* Posts */
  var s5 = section("posts", "Posts for approval", R.posts.note);
  var cols = h("div", { class: "cols" });
  [["X", R.posts.x, 280], ["LinkedIn", R.posts.linkedin, 3000]].forEach(function (p) {
    var col = h("div", null, [h("div", { class: "col-head" }, [h("h3", { text: p[0] + " · " + p[1].length + " posts" }), h("span", { class: "st progress", text: R.posts.status })])]);
    var l = h("ul", { class: "rows" });
    p[1].forEach(function (t) {
      var i = t.indexOf(":"), day = t.slice(0, i), body = t.slice(i + 1).trim();
      l.appendChild(h("li", { class: "post" }, [h("span", { class: "d", text: day }), h("div", null, [h("span", { class: "t", text: body }), p[0] === "X" ? h("span", { class: "c", text: body.length + " / " + p[2] }) : null])]));
    });
    col.appendChild(l); cols.appendChild(col);
  });
  s5.appendChild(cols);

  /* Tracking */
  var T = R.tracking;
  var s6 = section("tracking", "Tracking traffic from posts");
  s6.appendChild(h("p", { text: T.intro, style: "margin:0 0 16px;max-width:66ch" }));
  var u = T.example.split("?"), q = u[1].split("&"), url = h("div", { class: "url" }, [u[0] + "?"]);
  q.forEach(function (kv, idx) { var p = kv.split("="); url.appendChild(h("span", { class: "k", text: p[0] + "=" })); url.appendChild(h("span", { class: "val", text: p[1] })); if (idx < q.length - 1) url.appendChild(document.createTextNode("&")); });
  s6.appendChild(url);
  var t6 = h("table");
  T.parts.forEach(function (p) { t6.appendChild(h("tr", null, [h("td", { class: "code", text: p.tag }), h("td", { text: p.means })])); });
  s6.appendChild(t6);
  s6.appendChild(h("p", { text: "Source tags in use", style: "margin:20px 0 0;color:var(--muted);font-size:0.8125rem" }));
  s6.appendChild(h("ul", { class: "inline", style: "margin-top:8px" }, T.links.map(function (l) { return h("li", { text: l.source, title: l.channel }); })));
  s6.appendChild(h("div", { class: "callout", text: T.status }));
  s6.appendChild(h("p", { text: T.meanwhile, style: "margin:12px 0 0;color:var(--muted);max-width:66ch" }));

  /* Reddit */
  var s7 = section("reddit", "Reddit strategy", R.reddit.status);
  var ul7 = h("ul", { class: "bullets" }); R.reddit.principles.forEach(function (p) { ul7.appendChild(h("li", { text: p })); });
  s7.appendChild(ul7);
  s7.appendChild(h("ul", { class: "inline" }, R.reddit.communities.map(function (c) { return h("li", { text: c }); })));
  s7.appendChild(h("p", { text: "How we measure: " + R.reddit.measure, style: "margin:16px 0 0;color:var(--muted);max-width:66ch" }));

  /* Okara */
  var s8 = section("okara", "Marketing engine set-up", "Status of each part of the Okara workspace.");
  var labels = { done: "Done", progress: "In progress", todo: "To do", blocked: "Blocked" };
  var t8 = h("table");
  R.okara.forEach(function (o) {
    t8.appendChild(h("tr", null, [h("td", null, [o.item, o.note ? h("span", { class: "n", text: o.note }) : null]), h("td", { class: "v" }, [h("span", { class: "st " + o.status, text: labels[o.status] })])]));
  });
  s8.appendChild(t8);

  /* YouTube */
  var s9 = section("youtube", "YouTube and thumbnails", R.youtube.status);
  var ol9 = h("ol", { class: "steps" }); R.youtube.plan.forEach(function (p) { ol9.appendChild(h("li", { text: p })); });
  s9.appendChild(ol9);

  /* Footer + rail */
  var mail = function () { var a = h("a", { href: "mailto:" + R.contact, text: R.contact }); return a; };
  $("footer").appendChild(h("span", { text: R.schedule.note }));
  $("footer").appendChild(h("span", null, ["Questions: ", mail()]));
  $("railfoot").appendChild(h("span", null, ["Questions", h("br"), mail()]));

  var nav = $("nav");
  sections.forEach(function (s) { nav.appendChild(h("li", null, [h("a", { href: "#" + s.id, text: s.title, "data-id": s.id })])); });

  /* Deep links: content is built after load, so jump once it exists */
  if (location.hash && $(location.hash.slice(1))) $(location.hash.slice(1)).scrollIntoView();

  /* Scroll spy */
  var links = {}; [].forEach.call(nav.querySelectorAll("a"), function (a) { links[a.getAttribute("data-id")] = a; });
  var navBox = nav.parentElement;
  function setCurrent(id) {
    Object.keys(links).forEach(function (k) { if (k === id) links[k].setAttribute("aria-current", "true"); else links[k].removeAttribute("aria-current"); });
    if (navBox.scrollWidth > navBox.clientWidth) { // tab bar on small screens: keep the current tab in view
      var a = links[id]; navBox.scrollLeft = a.offsetLeft - (navBox.clientWidth - a.offsetWidth) / 2;
    }
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) setCurrent(e.target.id); }); }, { rootMargin: "-20% 0px -70% 0px" });
    sections.forEach(function (s) { io.observe($(s.id)); });
  }

  /* Theme */
  var root = document.documentElement, btn = $("theme");
  function isDark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function label() { btn.textContent = isDark() ? "Light" : "Dark"; }
  try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  label();
  btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
})();
</script>
